[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapo-cli"
dynamic = ["version"]
description = "Control Matter-era Tapo devices through TP-Link's new cloud API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "c0ffeeOverdose" }]
keywords = ["tapo", "tp-link", "smart-home", "iot", "cloud", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = [
  "requests>=2,<3",
]

[project.urls]
Repository = "https://github.com/c0ffeeOverdose/tapo-cli"
Issues = "https://github.com/c0ffeeOverdose/tapo-cli/issues"

[project.scripts]
tapo-cli = "tapo_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tapo_cli*"]

[tool.setuptools.package-data]
tapo_cli = ["certs/*.pem"]

[tool.setuptools.dynamic]
version = { attr = "tapo_cli.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
